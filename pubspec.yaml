name: biaimx
description: "BIAIMX — a financial guide covering exchange ratings, market charts and industry news."
publish_to: 'none'
version: 1.3.2+9

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  webview_flutter: ^4.14.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
