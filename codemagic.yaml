# Codemagic CI/CD configuration for BIAIMX
#
# 使用前需要在 Codemagic 中完成：
# 1. iOS：添加 App Store Connect API Key 集成，证书/描述文件由 ios_signing 自动管理；
#    并在环境变量组 app_store_credentials 中配置：
#      APP_STORE_CONNECT_PRIVATE_KEY
#      APP_STORE_CONNECT_KEY_IDENTIFIER
#      APP_STORE_CONNECT_ISSUER_ID
# 2. Android：上传 keystore（引用名 keystore_reference），在 google_play_credentials
#    环境变量组中配置 GCLOUD_SERVICE_ACCOUNT_CREDENTIALS（Google Play 服务账号 JSON）。
#    另外 android/app/build.gradle.kts 目前 release 仍使用 debug 签名，需要改成
#    release signing 配置后，Google Play 上传才会成功。
#
# 如果 Codemagic 上暂时没有 3.47.7，可把 flutter 改成 stable。

workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.7
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.biaimx.biaimx
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: com.biaimx.biaimx
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
        - pattern: "release/*"
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # 先上传 TestFlight；确认没问题后再改为提交 App Store 审核。
        submit_to_testflight: true

  android-release:
    name: Android Release
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: 3.47.7
      java: 17
      android_signing:
        - keystore_reference
      groups:
        - google_play_credentials
      vars:
        PACKAGE_NAME: com.biaimx.biaimx
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
        - pattern: "release/*"
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build App Bundle
        script: flutter build appbundle --release
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
